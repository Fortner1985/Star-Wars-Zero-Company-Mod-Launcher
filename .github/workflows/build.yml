name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build
        working-directory: launcher
        run: dotnet build src/ZeroSuite.App/ZeroSuite.App.csproj -c Release

  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Syntax-check every mod script
        run: find mod -name '*.lua' -print0 | xargs -0 -n1 luac5.4 -p
